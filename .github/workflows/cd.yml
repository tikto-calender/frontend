name: Deploy development

on:
  push:
    branches:
      - dev
    paths:
      - src/**
      - test/**
      - public/**
      - index.html
      - package.json
      - package-lock.json
      - eslint.config.*
      - vite.config.*
      - Dockerfile
      - nginx.conf
      - .env.example
      - .github/workflows/cd.yml

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  quality:
    name: Format, lint and test
    uses: tikto-calender/reusable-workflow/.github/workflows/node-ci.yml@main
    with:
      build-command: ""

  deploy:
    name: Build and deploy to S3
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: dev
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-2' }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Scan source with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: frontend-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload hashed assets to S3
        shell: bash
        run: |
          aws s3 sync dist/ "s3://${{ vars.FRONTEND_BUCKET_NAME }}" \
            --delete \
            --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload application entry point to S3
        shell: bash
        run: |
          aws s3 cp dist/index.html \
            "s3://${{ vars.FRONTEND_BUCKET_NAME }}/index.html" \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront cache
        id: invalidation
        shell: bash
        run: |
          invalidation_id=$(aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "id=${invalidation_id}" >> "${GITHUB_OUTPUT}"

      - name: Publish summary
        run: |
          echo "Deployed to \`s3://${{ vars.FRONTEND_BUCKET_NAME }}\`" >> "${GITHUB_STEP_SUMMARY}"
          echo "CloudFront invalidation: \`${{ steps.invalidation.outputs.id }}\`" >> "${GITHUB_STEP_SUMMARY}"
