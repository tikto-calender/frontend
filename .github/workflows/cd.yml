name: Deploy development
on:
  push:
    branches: [dev, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: gitops-dev
  cancel-in-progress: false

jobs:
  publish:
    uses: tikto-calender/reusable-workflow/.github/workflows/cd-dev.yml@main
    with:
      component: frontend
      gitops-repository: ${{ vars.GITOPS_REPOSITORY || 'tikto-calender/manifest' }}
    secrets:
      GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
