name: CI

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - ".github/workflows/**"
      - "src/**"
      - "test/**"
      - "public/**"
      - index.html
      - package.json
      - package-lock.json
      - "eslint.config.*"
      - "vite.config.*"
      - Dockerfile
      - nginx.conf
      - .dockerignore
      - .env.example
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test and build
    uses: tikto-calender/reusable-workflow/.github/workflows/ci-node.yml@main
    with:
      build-command: npm run build
